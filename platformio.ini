[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

build_flags =
    -Wall
    -Wextra
    -Wpedantic
    -I include

build_src_filter =
    +<battery.c>
    +<protocol.c>
    +<../firmware/esp32/main.cpp>